name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Adding Known Hosts
        run: ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "mkdir -p ~/geca-api"
          rsync -avz -e "ssh -p ${{ secrets.SSH_PORT }}" --exclude='.git/' --exclude='.github/' --exclude='.env' --exclude='verification.db' ./ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/geca-api/

      - name: Create .env file
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "cat > ~/geca-api/.env << 'EOL'
          API_KEY=${{ secrets.API_KEY }}
          EMAIL_ADDRESS=${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASS=${{ secrets.EMAIL_PASS }}
          EMAIL_SERVER=${{ secrets.EMAIL_SERVER }}
          EMAIL_PORT=${{ secrets.EMAIL_PORT }}
          TEXTMEBOT_API_KEY=${{ secrets.TEXTMEBOT_API_KEY }}
          TEXTMEBOT_API_URL=${{ secrets.TEXTMEBOT_API_URL }}
          MAX_DURATION=${{ secrets.MAX_DURATION }}
          MAX_ATTEMPS=${{ secrets.MAX_ATTEMPS }}
          EOL"

      - name: Connect to VPS and stop containers
        run: ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "cd ~/geca-api && docker compose down"

      - name: Build containers
        run: ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "cd ~/geca-api && docker compose build"

      - name: Start containers
        run: ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "cd ~/geca-api && docker compose up -d"sh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "cd ~/geca-api && docker compose up -d"-p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "cd ~/geca-api && docker compose down && docker compose build && docker compose up -d"sh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "cd ~/geca-api && docker compose down && docker compose build && docker compose up -d"${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "cd ~/geca-api && docker-compose down && docker-compose build && docker-compose up -d"